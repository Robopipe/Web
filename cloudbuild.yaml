# Cloud Build pipeline: build (with ephemeral Postgres for prerendering),
# push to Artifact Registry, migrate the target Cloud SQL database, deploy to Cloud Run.
#
# Two triggers use this file with different substitutions:
#   dev  branch -> _SERVICE=robopipe-web-staging, _SERVER_URL=https://staging.robopipe.io, ...
#   main branch -> _SERVICE=robopipe-web-prod,    _SERVER_URL=https://robopipe.io, ...
#
# Required Secret Manager secrets (per environment, suffix = _ENV):
#   robopipe-database-url-<env>   full postgres:// URL. For the migrate step the host must be
#                                 "sqlproxy" (Cloud SQL Auth Proxy on the cloudbuild network);
#                                 Cloud Run itself uses the /cloudsql unix-socket URL instead.
#   robopipe-payload-secret-<env>
#   robopipe-resend-api-key       (shared)

substitutions:
  _REGION: europe-west1
  _ENV: staging
  _SERVICE: robopipe-web-staging
  _SERVER_URL: https://staging.robopipe.io
  _PLAUSIBLE_DOMAIN: ''
  _GCS_BUCKET: robopipe-web-media-staging
  _CLOUDSQL_INSTANCE: '' # project:region:instance
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/robopipe/web

steps:
  # 1. Ephemeral Postgres for build-time migrations + page prerendering
  - id: build-db
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=build-db
      - --network=cloudbuild
      - -e=POSTGRES_USER=payload
      - -e=POSTGRES_PASSWORD=payload
      - -e=POSTGRES_DB=robopipe
      - postgres:17-alpine

  # 2. Build the image (builder stage migrates the ephemeral DB, then next build)
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --network=cloudbuild
      - --build-arg=NEXT_PUBLIC_SERVER_URL=${_SERVER_URL}
      - --build-arg=NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${_PLAUSIBLE_DOMAIN}
      - -t=${_IMAGE}:${COMMIT_SHA}
      - -t=${_IMAGE}:${_ENV}-latest
      - .
    waitFor: ['build-db']

  # 3. Push
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']
    waitFor: ['build']

  # 4a. Cloud SQL Auth Proxy for the migration step
  - id: sqlproxy
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=sqlproxy
      - --network=cloudbuild
      - gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
      - --address=0.0.0.0
      - --port=5432
      - ${_CLOUDSQL_INSTANCE}
    waitFor: ['build']

  # 4b. Run Payload migrations against the target Cloud SQL database
  - id: migrate
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker build --target builder --network=cloudbuild -t migrator . \
        && docker run --rm --network=cloudbuild \
          -e DATABASE_URL="$$MIGRATE_DATABASE_URL" \
          -e PAYLOAD_SECRET="$$PAYLOAD_SECRET" \
          migrator pnpm payload migrate
    secretEnv: ['MIGRATE_DATABASE_URL', 'PAYLOAD_SECRET']
    waitFor: ['sqlproxy']

  # 5. Deploy to Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${COMMIT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=3000
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=NEXT_PUBLIC_SERVER_URL=${_SERVER_URL},NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${_PLAUSIBLE_DOMAIN},GCS_BUCKET=${_GCS_BUCKET},GCS_PROJECT_ID=${PROJECT_ID}
      - --set-secrets=DATABASE_URL=robopipe-database-url-${_ENV}:latest,PAYLOAD_SECRET=robopipe-payload-secret-${_ENV}:latest,RESEND_API_KEY=robopipe-resend-api-key:latest,PREVIEW_SECRET=robopipe-preview-secret-${_ENV}:latest
      - --min-instances=1
      - --max-instances=3
      - --memory=1Gi
    waitFor: ['push', 'migrate']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/robopipe-database-url-migrate-${_ENV}/versions/latest
      env: MIGRATE_DATABASE_URL
    - versionName: projects/${PROJECT_ID}/secrets/robopipe-payload-secret-${_ENV}/versions/latest
      env: PAYLOAD_SECRET

images:
  - ${_IMAGE}:${COMMIT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
